<!DOCTYPE html>
<html>

<head>

    <title>Mobile Price Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        .input-box {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        .result {
            text-align: center;
            margin-top: 25px;
            font-size: 25px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Mobile Price Prediction</h1>

    <form method="POST">

        {% for column in columns %}

        <div class="input-box">

            <label>{{ column }}</label>

            <input
                type="number"
                step="any"
                name="{{ column }}"
                required
            >

        </div>

        {% endfor %}

        <button type="submit">
            Predict Price
        </button>

    </form>

    {% if prediction %}

    <div class="result">

        Predicted Price Range:
        <br>
        {{ prediction }}

    </div>

    {% endif %}

</div>

</body>

</html>
